[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdc-soi"
version = "0.1.0"
description = "BDC Schedule of Investments extraction engine (XBRL, Inline XBRL, HTML; effective-dated templates)"
requires-python = ">=3.11"
dependencies = [
  "arelle-release>=2.30",
  "requests>=2.31",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "rapidfuzz>=3.6",
  "pyarrow>=15.0",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bdc-soi = "bdc_soi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: requires live SEC network access and SEC_USER_AGENT; run with BDC_SOI_LIVE=1",
]
filterwarnings = ["ignore::DeprecationWarning"]
