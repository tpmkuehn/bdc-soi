# Company template for PIMCO Capital Solutions BDC Corp. (CIK 1905824). Grounded in SEC accession 0001193125-26-344935 (10-Q, report date 2026-06-30);
# a prior period was inspected as recorded in docs/coverage-report.md. Rules cite filing evidence in `evidence`.
schema_version: 1
cik: '1905824'
company_name: PIMCO Capital Solutions BDC Corp.
templates:
- id: pimco-capital-solutions-2026-layout-v1
  priority: 100
  effective_from: '2026-03-31'
  effective_to: null
  forms:
  - 10-Q
  status: production
  description: 'Typed labels are pipe-delimited: ''Debt Investments | First Lien Senior Secured | Technology | MRI Software, LLC Term Loan | SOFR + 4.750 % | 8.450 % | 02/10/2028'' (issuer and facility
    share one part, as in the HTML ''Investments'' column); a ''Total Investments'' member is tagged on the holding axis. HTML SOI in thousands: ''Investments | Reference Rate Spread | Interest Rate | Maturity
    Date | Par Amount/ Shares | Cost | Fair Value | Percentage of Net Assets''.'
  evidence:
  - '0001193125-26-344935 (2026-06-30): 93 typed members incl. ''Total Investments'' (197,727,000) which equals the undimensioned InvestmentOwnedAtFairValue; HTML ''Total Investments $202,599 $197,727'''
  - '0001193125-26-344935: SOFR appears as the full word in labels and HTML; rates like ''20.000% PIK'' and ''17.000% ( 7.000% PIK)'''
  - 0001193125-26-224212 (2026-03-31) inspected as the prior period
  xbrl:
    role_regex:
    - Schedule of Investments
    row_axes:
      explicit_qnames:
      - us-gaap:InvestmentIdentifierAxis
      exclude_regex:
      - FairValue.*Hierarchy
    context_filters:
      require_report_date: true
      allowed_period_types:
      - instant
      excluded_axes_regex:
      - FairValueByFairValueHierarchyLevel
    total_concepts:
      fair_value:
      - us-gaap:InvestmentOwnedAtFairValue
      cost:
      - us-gaap:InvestmentOwnedAtCost
  html:
    table_detection:
      heading_regex:
      - Schedule of Investments
      required_terms:
      - Fair Value
      excluded_terms:
      - Fair Value Hierarchy
      - Financial Highlights
      minimum_score: 6
      max_heading_distance: 20
    header_rows:
      min: 1
      max: 3
    header_aliases:
      issuer_name:
      - ^Investments
      interest_rate_text:
      - ^Reference Rate Spread
      interest_rate:
      - ^Interest Rate
      cost:
      - ^Cost
      fair_value:
      - ^Fair Value
      maturity_date:
      - ^Maturity Date
    scale:
      source: table_then_document
      thousands_regex:
      - in thousands
      default: 1
    row_rules:
      carry_forward: []
      group_heading_target: industry
      group_heading_rules:
      - regex: affiliated|controlled
        target: affiliate_status
      - regex: ^(Debt Investments|Equity Investments|Short-Term Investments)$
        target: investment_type
      - regex: ^(First Lien Senior Secured|Second Lien Senior Secured|Unsecured|Warrants|Common Stock|Preferred Stock|U\.S\. Treasury Bills|U\.S\. Government Agencies)$
        target: sector
      total_if_regex:
      - ^Total Investments\b(?!\s+in\s)
      subtotal_if_regex:
      - ^Total\b
      require_any_numeric:
      - fair_value
      - cost
      - principal_amount
      - shares
    prefer_html_fields:
    - issuer_name
    rate_parser: &id001
      pattern: (?P<index>SOFR|EURIBOR|Prime)\s*\+\s*(?P<spread_pct>\d+(?:\.\d+)?)\s*%
      spread_unit: percent
      pik_pattern: \(\s*(?P<pik_pct>\d+(?:\.\d+)?)\s*%\s*PIK\s*\)
      index_aliases:
        SOFR: SOFR
        EURIBOR: EURIBOR
        Prime: Prime
  composite_fields:
  - id: pimco-pipe-label-v1
    source_field: issuer_name
    applies_to: xbrl
    pattern: ^(?P<investment_type>[^|]+?)\s*\|\s*(?P<security>[^|]+?)\s*\|\s*(?P<industry>[^|]+?)\s*\|\s*(?P<issuer>[^|]+?)\s*(?:\|\s*(?P<rate>[^|]*?\+[^|]*?)\s*)?(?:\|\s*(?P<interest_rate>\d+(?:\.\d+)?\s*%)\s*)?(?:\|\s*(?P<maturity>\d{1,2}/\d{1,2}/\d{4})\s*)?$
    capture_targets:
      security: sector
    rate_parser: *id001
  normalization:
    legal_suffixes:
      remove_preceding_comma: true
    date_formats:
    - '%m/%d/%Y'
    - '%Y-%m-%d'
    spread_input_unit: percent
    spread_output_format: decimal
    reference_index_aliases: {}
  validation: {}
  overrides: []
