# Company template for Goldman Sachs BDC, Inc. (CIK 1572694). Grounded in SEC accession 0001193125-26-338331 (10-Q, report date 2026-06-30);
# a prior period was inspected as recorded in docs/coverage-report.md. Rules cite filing evidence in `evidence`.
schema_version: 1
cik: '1572694'
company_name: Goldman Sachs BDC, Inc.
templates:
- id: goldman-sachs-bdc-2026-layout-v1
  priority: 100
  effective_from: '2026-03-31'
  effective_to: null
  forms:
  - 10-Q
  status: production
  description: 'Typed labels: ''Investment {Section} - x% {Country} - x% {Security type} - x% {Issuer} Industry {Industry} Interest Rate 8.41% Reference Rate and Spread S + 4.75% Maturity MM/DD/YY [Acquisition
    Date ...]''. HTML SOI in thousands: ''Investment | Industry | Interest Rate | Reference Rate and Spread | Maturity | Par | Cost | Fair Value | Footnotes'' with section/country/security-type heading
    rows carrying percentages; foreign-currency par shown as ''CAD 7,791''.'
  evidence:
  - '0001193125-26-338331 (2026-06-30): 560 typed members; undimensioned fair value 3,195,248,000 and cost 3,410,976,000 within tolerance of the holdings sums'
  - '0001193125-26-338331: index letters S/C/E/P/SN/B/N supported by InvestmentVariableInterestRateTypeExtensibleEnumeration (SOFR 494, CORRA 9, Prime 5) on the same members; 5 fair-value facts tagged in
    CAD equal the USD HTML cells (reporting-currency confirmation rule)'
  - '0001193125-26-338331: 117 negative fair-value facts on unfunded facilities; maturities are MM/DD/YY'
  - 0001193125-26-212431 (2026-03-31) inspected as the prior period
  xbrl:
    role_regex:
    - Schedule of Investments
    row_axes:
      explicit_qnames:
      - us-gaap:InvestmentIdentifierAxis
      exclude_regex:
      - FairValue.*Hierarchy
    context_filters:
      require_report_date: true
      allowed_period_types:
      - instant
      excluded_axes_regex:
      - FairValueByFairValueHierarchyLevel
    total_concepts:
      fair_value:
      - us-gaap:InvestmentOwnedAtFairValue
      cost:
      - us-gaap:InvestmentOwnedAtCost
  html:
    table_detection:
      heading_regex:
      - Schedule of Investments
      required_terms:
      - Fair Value
      excluded_terms:
      - Fair Value Hierarchy
      - Financial Highlights
      minimum_score: 6
      max_heading_distance: 20
    header_rows:
      min: 1
      max: 3
    header_aliases:
      issuer_name:
      - ^Investment
      industry:
      - ^Industry
      interest_rate:
      - ^Interest Rate
      interest_rate_text:
      - ^Reference Rate and Spread
      cost:
      - ^Cost
      fair_value:
      - ^Fair Value
      maturity_date:
      - ^Maturity
      principal_amount:
      - ^Par
      footnote_markers:
      - ^Footnotes
    scale:
      source: table_then_document
      thousands_regex:
      - in thousands
      default: 1
    row_rules:
      carry_forward: []
      group_heading_target: investment_type
      group_heading_rules:
      - regex: affiliated|controlled
        target: affiliate_status
      - regex: ^(United States|Canada|United Kingdom|India|Australia|Europe|Netherlands|Germany|France|Luxembourg|Ireland|Spain|Sweden|Norway|Denmark|Belgium|Italy|Switzerland|Israel|Singapore|Japan)\b
        target: country
      total_if_regex:
      - ^Total Investments\b(?!\s+in\s)
      - ^Total investments\b(?!\s+in\s)
      subtotal_if_regex:
      - ^Total\b
      require_any_numeric:
      - fair_value
      - cost
      - principal_amount
      - shares
    prefer_html_fields:
    - issuer_name
    rate_parser: &id001
      pattern: (?P<index>S|C|E|P|SN|B|N|SOFR|CORRA|EURIBOR|Prime|SONIA)\s*\+\s*(?P<spread_pct>\d+(?:\.\d+)?)\s*%
      spread_unit: percent
      pik_pattern: (?P<pik_pct>\d+(?:\.\d+)?)\s*%\s*PIK
      index_aliases:
        S: SOFR
        SOFR: SOFR
        C: CORRA
        CORRA: CORRA
        E: EURIBOR
        EURIBOR: EURIBOR
        P: Prime
        Prime: Prime
        SN: SONIA
        SONIA: SONIA
        B: BBSY
        N: NIBOR
  composite_fields:
  - id: gsbd-label-v1
    source_field: issuer_name
    applies_to: xbrl
    pattern: ^Investment\s+(?P<investment_type>.+?) [-–] \d+(?:\.\d+)?%\s+(?P<country>.+?) [-–] \d+(?:\.\d+)?%\s+(?P<security>.+?) [-–] \d+(?:\.\d+)?%\s+(?P<issuer>.+?)\s+Industry\s+(?P<industry>.+?)(?:\s+Interest
      Rate\s+(?P<interest_rate>\d+(?:\.\d+)?%))?(?:\s+Reference Rate and Spread\s+(?P<rate>.+?))?(?:\s+Maturity\s+(?P<maturity>\d{2}/\d{2}/\d{2}))?(?:\s+Acquisition Date.*)?$
    capture_targets:
      security: description
    rate_parser: *id001
  normalization:
    legal_suffixes:
      remove_preceding_comma: true
    date_formats:
    - '%m/%d/%y'
    - '%m/%d/%Y'
    - '%Y-%m-%d'
    spread_input_unit: percent
    spread_output_format: decimal
    reference_index_aliases:
      S: SOFR
      C: CORRA
      E: EURIBOR
      P: Prime
      SN: SONIA
  validation:
    reporting_currency_evidence:
    - '0001193125-26-338331 and 0001193125-26-212431, Consolidated Schedule of Investments footnote: ''Par amount is denominated in U.S. Dollars ("$" or "USD") unless otherwise noted, Euros ("EUR"), Great
      British Pounds ("GBP"), Norwegian Kroner ("NOK"), Canadian Dollars ("CAD") or Australian Dollars ("AUD").'''
    - '0001193125-26-338331 and 0001193125-26-212431, Note 2 Basis of Presentation: ''The Company''s functional currency is USD and these consolidated financial statements have been prepared in that currency.''
      and ''purchases and sales of investments ... denominated in foreign currencies are translated into USD based upon currency exchange rates prevailing on the transaction dates.'''
    allow_negative_fair_value: true
    allow_negative_fair_value_evidence: '0001193125-26-338331: 117 negative InvestmentOwnedAtFairValue facts on unfunded facilities.'
  overrides: []
