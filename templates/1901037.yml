# Company template for Stellus Private Credit BDC (CIK 1901037). Grounded in SEC accession 0001104659-26-094771 (10-Q, report date 2026-06-30);
# a prior period was inspected as recorded in docs/coverage-report.md. Rules cite filing evidence in `evidence`.
schema_version: 1
cik: '1901037'
company_name: Stellus Private Credit BDC
templates:
- id: stellus-private-credit-2026-layout-v1
  priority: 100
  effective_from: '2026-03-31'
  effective_to: null
  forms:
  - 10-Q
  status: production
  description: 'XBRL carries issuer, industry, affiliation and type as extensible enumerations; typed labels are ''{Issuer}, {Description}''. HTML SOI in whole dollars with zero-width-space padded headers:
    ''Investments | Footnotes | Security | Coupon | Floor | Cash | PIK | Investment Date | Maturity | Principal | Amortized Cost | Fair Value''.'
  evidence:
  - '0001104659-26-094771 (2026-06-30): 337 typed members; undimensioned fair value 419,527,201 and cost 410,125,150 within tolerance of the holdings sums; enumeration values ''Three Month Sofr''/''One
    Month Sofr''/''Six Month Sofr'''
  - '0001104659-26-094771 HTML: a blank first row precedes three header rows whose words are split (''Principal'' / ''Amount/'' / ''Shares (3)'', ''Amortized'' / ''Cost'', ''Fair'' / ''Value (1)'') and
    every other cell is a zero-width-space spacer; reconstruction keeps original cell text and strips the invisible characters only in the parsing representation (iteration 010); partial-word aliases retained
    for robustness'
  - 0001104659-26-059217 (2026-03-31) inspected as the prior period
  - '0001104659-26-094771 HTML tables 10-18: the portfolio company is a heading row (''Bart & Associates, LLC | (4) | ... | McLean, VA''); the ''Investments'' column holds the security (''Term Loan'', ''Sapphire
    Aggregator S.a r.l. Class G Shares'') and ''Security'' holds the type (''First Lien'', ''Equity''); typed labels are ''{Portfolio company}, {security}'' (e.g. ''Monitorus Holding LLC, Sapphire Aggregator
    S.a r.l. Class G Shares'', ''Champion Services Acquireco LLC, Term Loan (PBDC SPV)'') or ''{Portfolio company} {security}'' without a comma (''AdCellerant LLC Term A Loan'')'
  xbrl:
    role_regex:
    - Schedule of Investments
    row_axes:
      explicit_qnames:
      - us-gaap:InvestmentIdentifierAxis
      exclude_regex:
      - FairValue.*Hierarchy
    context_filters:
      require_report_date: true
      allowed_period_types:
      - instant
      excluded_axes_regex:
      - FairValueByFairValueHierarchyLevel
    total_concepts:
      fair_value:
      - us-gaap:InvestmentOwnedAtFairValue
      cost:
      - us-gaap:InvestmentOwnedAtCost
  html:
    table_detection:
      heading_regex:
      - Schedule of Investments
      required_terms:
      - Fair
      optional_terms:
      - Amortized
      - Principal
      excluded_terms:
      - Fair Value Hierarchy
      - Financial Highlights
      - '% of Total Investments'
      minimum_score: 6
      max_heading_distance: 20
    header_rows:
      min: 1
      max: 3
    header_aliases:
      security_description:
      - ^Investments?$
      industry:
      - ^Headquarters
      investment_type:
      - ^Security
      interest_rate:
      - ^Coupon
      rate_floor:
      - ^Floor
      cash_rate:
      - ^Cash$
      pik_rate:
      - ^PIK
      cost:
      - '^Amortized(?: Cost)?$'
      fair_value:
      - '^Fair(?: Value)?$'
      maturity_date:
      - ^Maturity
      principal_amount:
      - ^Principal
      footnote_markers:
      - ^Footnotes
      percent_of_net_assets:
      - ^% of Net
    scale:
      source: fixed
      fixed_multiplier: 1
      default: 1
    row_rules:
      carry_forward: []
      group_heading_target: issuer_name
      group_heading_rules:
      - regex: affiliated|controlled
        target: affiliate_status
      total_if_regex:
      - ^Total Investments\b(?!\s+in\s)
      subtotal_if_regex:
      - ^Total\b
      require_any_numeric:
      - fair_value
      - cost
      - principal_amount
      - shares
    prefer_html_fields: []
    disabled: false
  composite_fields:
  - id: stellus-label-v1
    source_field: issuer_name
    applies_to: xbrl
    pattern: '^(?P<issuer>.+?(?:, (?:LLC|Inc\.?|L\.P\.|LP|Ltd\.?|Corp\.?))?),? (?P<description>(?:Term Loan|Term [A-Z] Loan|Revolver(?: One| Two)?|Delayed Draw[^,]*|Class [A-Z]-?\d* (?:Units|Shares)|Preferred
      Stock|Common Stock|Warrants?|Equity|LP Interest|Convertible Bonds|Calss A Units|(?<=, )[^,]+)(?: \(PBDC SPV\))?)$'
  normalization:
    legal_suffixes:
      remove_preceding_comma: true
    date_formats:
    - '%m/%d/%Y'
    - '%Y-%m-%d'
    spread_input_unit: percent
    spread_output_format: decimal
    reference_index_aliases: {}
  validation:
    reporting_currency_evidence:
    - '0001104659-26-094771, Consolidated Schedule of Investments footnote: ''Par amount is denominated in U.S. Dollars ("$") unless otherwise noted in Euros ("€").'' (table_15 rows t15r48-t15r50 print
      ''€1,353,050'' in the par column and USD cost/fair value)'
    - '0001104659-26-094771, Note 2: ''The accounting records of the Company are maintained in U.S. dollars.'' and ''Foreign currency amounts are translated into U.S. dollars ...'''
  overrides: []
