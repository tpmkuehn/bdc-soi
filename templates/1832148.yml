# Company template for SLR HC BDC LLC (CIK 1832148). Grounded in SEC accession 0001193125-26-332723 (10-Q, report date 2026-06-30);
# a prior period was inspected as recorded in docs/coverage-report.md. Rules cite filing evidence in `evidence`.
schema_version: 1
cik: '1832148'
company_name: SLR HC BDC LLC
templates:
- id: slr-hc-bdc-2026-layout-v1
  priority: 100
  effective_from: '2026-03-31'
  effective_to: null
  forms:
  - 10-Q
  status: production
  description: 'SLR-managed layout. Typed labels are pipe-delimited: ''Bank Debt/Senior Secured Loans[ — x%] | {Issuer} | {Industry} | S+525 | 1.00% | 8.98% | M/YYYY | M/YYYY'' (section, issuer, industry,
    spread in basis points, floor, interest rate, acquisition, maturity). HTML SOI in thousands: ''Description | Industry | Spread above Index | Floor | Interest Rate | Acquisition Date | Maturity Date
    | Par Amount | Cost | Fair Value''; month/year maturities are left null.'
  evidence:
  - '0001193125-26-332723 (2026-06-30): 37 typed members; HTML grand total ''Total Investments'' equals the holdings sums (fair value and cost pass)'
  - '0001193125-26-332723: ''S'' supported by InvestmentVariableInterestRateTypeExtensibleEnumeration = SOFR; spreads are basis points (''S+525'' with XBRL spread 0.0525)'
  - 0001193125-26-206309 (2026-03-31) inspected as the prior period
  xbrl:
    role_regex:
    - Schedule of Investments
    row_axes:
      explicit_qnames:
      - us-gaap:InvestmentIdentifierAxis
      exclude_regex:
      - FairValue.*Hierarchy
    context_filters:
      require_report_date: true
      allowed_period_types:
      - instant
      excluded_axes_regex:
      - FairValueByFairValueHierarchyLevel
    total_concepts:
      fair_value:
      - us-gaap:InvestmentOwnedAtFairValue
      cost:
      - us-gaap:InvestmentOwnedAtCost
  html:
    table_detection:
      heading_regex:
      - Schedule of Investments
      required_terms:
      - Fair Value
      excluded_terms:
      - Fair Value Hierarchy
      - Financial Highlights
      minimum_score: 6
      max_heading_distance: 20
    header_rows:
      min: 1
      max: 3
    header_aliases:
      issuer_name:
      - ^Description
      industry:
      - ^Industry
      interest_rate_text:
      - ^Spread above Index
      rate_floor:
      - ^Floor
      interest_rate:
      - ^Interest Rate
      cost:
      - ^Cost
      fair_value:
      - ^Fair Value
      maturity_date:
      - ^Maturity Date
      principal_amount:
      - ^Par Amount
      shares:
      - ^Shares
    scale:
      source: table_then_document
      thousands_regex:
      - in thousands
      default: 1
    row_rules:
      carry_forward: []
      group_heading_target: investment_type
      group_heading_rules:
      - regex: affiliated|controlled
        target: affiliate_status
      total_if_regex:
      - ^Total Investments\b(?!\s*\(?\d*\)?\s*(?:&|and)\s+Cash)(?!\s+in\s)
      subtotal_if_regex:
      - ^Total\b
      require_any_numeric:
      - fair_value
      - cost
      - principal_amount
      - shares
    prefer_html_fields:
    - issuer_name
    rate_parser: &id001
      pattern: (?P<index>S|P|SOFR|Prime)\s*\+\s*(?P<spread_bps>\d+)(?!\.\d)(?!\s*%)
      spread_unit: basis_points
      index_aliases:
        S: SOFR
        SOFR: SOFR
        P: Prime
        Prime: Prime
  composite_fields:
  - id: slr-pipe-label-v1
    source_field: issuer_name
    applies_to: xbrl
    kind: delimited
    delimiter: '|'
    positions:
      investment_type: 0
      issuer: 1
      industry: 2
      rate: 3
      rate_floor: 4
      interest_rate: 5
    min_parts: 3
    rate_parser: *id001
  normalization:
    legal_suffixes:
      remove_preceding_comma: true
    date_formats:
    - '%m/%d/%Y'
    - '%Y-%m-%d'
    spread_input_unit: basis_points
    spread_output_format: decimal
    reference_index_aliases:
      S: SOFR
      P: Prime
  validation: {}
  overrides: []
