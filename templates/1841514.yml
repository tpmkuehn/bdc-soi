# Company template for Commonwealth Credit Partners BDC I, Inc. (CIK 1841514). Grounded in SEC accession 0001193125-26-344908 (10-Q, report date 2026-06-30);
# a prior period was inspected as recorded in docs/coverage-report.md. Rules cite filing evidence in `evidence`.
schema_version: 1
cik: '1841514'
company_name: Commonwealth Credit Partners BDC I, Inc.
templates:
- id: commonwealth-credit-2026-layout-v1
  priority: 100
  effective_from: '2026-03-31'
  effective_to: null
  forms:
  - 10-Q
  status: production
  description: 'Typed labels: ''Debt Investments, First Lien Senior Secured, {Issuer} - {Description}, {Industry}, Spread Above Index SOFR + 5.50% (1.00% floor) + 2.25% PIK Interest Rate 11.44% Maturity
    Date 5/10/2027'' and equity ''Membership Interest Investments, Common Membership Interest, {Issuer} - {Description}, {Industry}''. HTML SOI in thousands; the first column combines issuer and facility
    (''190 Octane Financing, LLC - Term Loan''); cash equivalents are listed after ''Total Investments''.'
  evidence:
  - '0001193125-26-344908 (2026-06-30): 172 typed members; HTML ''Total Investments $669,057 $623,418'' equals the undimensioned XBRL facts; HTML ''Amortized Cost'' equals us-gaap:InvestmentOwnedAtCost
    on 118/118 matched rows => cost'
  - '0001193125-26-344908: 10 negative fair-value facts on unfunded facilities; SOFR is the only index token in HTML rate text'
  - 0001193125-26-219691 (2026-03-31) inspected as the prior period
  xbrl:
    role_regex:
    - Schedule of Investments
    row_axes:
      explicit_qnames:
      - us-gaap:InvestmentIdentifierAxis
      exclude_regex:
      - FairValue.*Hierarchy
    context_filters:
      require_report_date: true
      allowed_period_types:
      - instant
      excluded_axes_regex:
      - FairValueByFairValueHierarchyLevel
    total_concepts:
      fair_value:
      - us-gaap:InvestmentOwnedAtFairValue
      cost:
      - us-gaap:InvestmentOwnedAtCost
  html:
    table_detection:
      heading_regex:
      - Schedule of Investments
      required_terms:
      - Fair Value
      excluded_terms:
      - Fair Value Hierarchy
      - Financial Highlights
      minimum_score: 6
      max_heading_distance: 20
    header_rows:
      min: 1
      max: 3
    header_aliases:
      issuer_name:
      - ^Portfolio Company
      industry:
      - ^Industry
      interest_rate_text:
      - ^Spread Above Index
      interest_rate:
      - ^Interest Rate
      cost:
      - ^Amortized Cost
      fair_value:
      - ^Fair Value
      maturity_date:
      - ^Maturity Date
    scale:
      source: table_then_document
      thousands_regex:
      - in thousands
      default: 1
    row_rules:
      carry_forward: []
      group_heading_target: investment_type
      group_heading_rules:
      - regex: affiliated|controlled
        target: affiliate_status
      total_if_regex:
      - ^Total Investments\b(?!\s+in\s)
      subtotal_if_regex:
      - ^Total\b
      require_any_numeric:
      - fair_value
      - cost
      - principal_amount
      - shares
    prefer_html_fields:
    - issuer_name
    rate_parser: &id001
      pattern: (?:\d+\s*M(?:onth)?\s+)?(?P<index>SOFR|Prime|PRIME|S|P|EURIBOR|E|SONIA|CORRA|C|BBSY|B|BBSW|BKBM|SARON|STIBOR|NIBOR)\s*\+\s*(?:CSA\s*\+\s*)?(?P<spread_pct>\d+(?:\.\d+)?)\s*%?
      floor_pattern: (?P<floor_pct>\d+(?:\.\d+)?)\s*%\s*[Ff]loor
      pik_pattern: (?P<pik_pct>\d+(?:\.\d+)?)\s*%\s*PIK
      spread_unit: percent
      index_aliases:
        SOFR: SOFR
        S: SOFR
        Prime: Prime
        PRIME: Prime
        P: Prime
        EURIBOR: EURIBOR
        E: EURIBOR
        SONIA: SONIA
        CORRA: CORRA
        C: CORRA
        BBSY: BBSY
        B: BBSY
        BBSW: BBSW
        BKBM: BKBM
        SARON: SARON
        STIBOR: STIBOR
        NIBOR: NIBOR
  composite_fields:
  - id: commonwealth-debt-label-v1
    source_field: issuer_name
    applies_to: xbrl
    pattern: ^(?P<section>[^,]+), (?P<investment_type>[^,]+), (?P<issuer>.+?) - (?P<description>[^,]+), (?P<industry>[^,]+?),?\s+Spread Above Index\s+(?P<rate>.+?)\s+Interest Rate\s+(?P<interest_rate>\d+(?:\.\d+)?%)(?:\s+Maturity
      Date\s+(?P<maturity>\d{1,2}/\d{1,2}/\d{4}))?$
    capture_targets:
      section: sector
    rate_parser: *id001
  - id: commonwealth-equity-label-v1
    source_field: issuer_name
    applies_to: xbrl
    pattern: ^(?P<section>[^,]+), (?P<investment_type>[^,]+), (?P<issuer>.+?) - (?P<description>[^,]+), (?P<industry>[^,]+)$
    capture_targets:
      section: sector
  - id: commonwealth-html-issuer-split-v1
    source_field: issuer_name
    applies_to: html
    pattern: ^(?P<issuer>.+?) - (?P<description>.+)$
  normalization:
    legal_suffixes:
      remove_preceding_comma: true
    date_formats:
    - '%m/%d/%Y'
    - '%Y-%m-%d'
    spread_input_unit: percent
    spread_output_format: decimal
    reference_index_aliases: {}
  validation:
    allow_negative_fair_value: true
    allow_negative_fair_value_evidence: '0001193125-26-344908: 10 negative InvestmentOwnedAtFairValue facts on unfunded revolving/delayed-draw facilities.'
  overrides: []
