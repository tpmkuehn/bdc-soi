# Company template for Palmer Square Capital BDC Inc. (CIK 1794776). Grounded in SEC accession 0001193125-26-333791 (10-Q, report date 2026-06-30);
# a prior period was inspected as recorded in docs/coverage-report.md. Rules cite filing evidence in `evidence`.
schema_version: 1
cik: '1794776'
company_name: Palmer Square Capital BDC Inc.
templates:
- id: palmer-square-2026-layout-v1
  priority: 100
  effective_from: '2026-03-31'
  effective_to: null
  forms:
  - 10-Q
  status: production
  description: 'Typed labels: ''Portfolio Company {Section} {Industry} {Issuer} Investment {Description} Interest Rate 6.60% (S + 2.75%) Maturity Date M/D/YYYY''. HTML SOI in whole dollars: ''Portfolio
    Company | Investment | Interest Rate | Maturity Date | Principal / Par | Amortized Cost | Fair Value | Percentage of Net Assets'' with industry headings; rate text ''6.60% (S + 2.75%)'' / ''7.51% (S
    +CSA + 3.75%)''.'
  evidence:
  - '0001193125-26-333791 (2026-06-30): 319 typed members; undimensioned fair value 1,113,377,240 and cost 1,242,154,553 within tolerance of the holdings sums; HTML ''Amortized Cost'' equals us-gaap:InvestmentOwnedAtCost
    on 263/263 matched rows'
  - '0001193125-26-333791: ''S'' supported by InvestmentVariableInterestRateTypeExtensibleEnumeration = SOFR on 253 members; industry vocabulary from HTML heading rows'
  - 0001193125-26-207523 (2026-03-31) inspected as the prior period
  xbrl:
    role_regex:
    - Schedule of Investments
    row_axes:
      explicit_qnames:
      - us-gaap:InvestmentIdentifierAxis
      exclude_regex:
      - FairValue.*Hierarchy
    context_filters:
      require_report_date: true
      allowed_period_types:
      - instant
      excluded_axes_regex:
      - FairValueByFairValueHierarchyLevel
    total_concepts:
      fair_value:
      - us-gaap:InvestmentOwnedAtFairValue
      cost:
      - us-gaap:InvestmentOwnedAtCost
  html:
    table_detection:
      heading_regex:
      - Schedule of Investments
      required_terms:
      - Fair Value
      excluded_terms:
      - Fair Value Hierarchy
      - Financial Highlights
      minimum_score: 6
      max_heading_distance: 20
    header_rows:
      min: 1
      max: 3
    header_aliases:
      issuer_name:
      - ^Portfolio Company
      security_description:
      - ^Investment$
      interest_rate_text:
      - ^Interest Rate
      cost:
      - ^Amortized Cost
      - ^Cost$
      fair_value:
      - ^Fair Value
      maturity_date:
      - ^Maturity Date
      principal_amount:
      - ^Principal
      shares:
      - ^Number of Shares
    scale:
      source: fixed
      fixed_multiplier: 1
      default: 1
    row_rules:
      carry_forward: []
      group_heading_target: industry
      group_heading_rules:
      - regex: affiliated|controlled
        target: affiliate_status
      - regex: ^(Debt Investments|Equity Investments|Structured Subordinated Note|Collateralized Loan Obligations?)$
        target: investment_type
      total_if_regex:
      - ^Total Investments\b(?!\s+in\s)
      subtotal_if_regex:
      - ^Total\b
      require_any_numeric:
      - fair_value
      - cost
      - principal_amount
      - shares
    prefer_html_fields:
    - issuer_name
    rate_parser: &id001
      pattern: \(\s*(?P<index>S|P|SOFR|Prime)\s*\+\s*(?:CSA\s*\+\s*)?(?P<spread_pct>\d+(?:\.\d+)?)\s*%\s*\)
      interest_rate_pattern: ^(?P<rate_pct>\d+(?:\.\d+)?)\s*%
      spread_unit: percent
      index_aliases:
        S: SOFR
        SOFR: SOFR
        P: Prime
        Prime: Prime
  composite_fields:
  - id: palmer-square-label-v1
    source_field: issuer_name
    applies_to: xbrl
    pattern: ^Portfolio Company\s+(?P<investment_type>Debt Investments|Equity Investments|Structured Subordinated Note|Structured Subordinated Notes)\s+(?P<header>.+?)\s+Investment\s+(?P<description>.+?)(?:\s+Interest
      Rate\s+(?P<rate>.+?))?(?:\s+Maturity Date\s+(?P<maturity>\d{1,2}/\d{1,2}/\d{4}))?$
    header_parser:
      known_industries:
      - Aerospace and Defense
      - Auto Components
      - Automotive
      - Building Products
      - Chemicals
      - Commercial Services and Supplies
      - Construction Materials
      - Construction and Engineering
      - Containers and Packaging
      - Diversified Consumer Services
      - Diversified Financial Services
      - Diversified Telecommunication Services
      - Electronic Equipment, Instruments and Components
      - Energy Equipment and Services
      - Entertainment
      - Food Products
      - Ground Transportation
      - Healthcare Equipment and Supplies
      - Healthcare Providers and Services
      - Healthcare Technology
      - Hotels, Restaurants and Leisure
      - Household Durables
      - Household Products
      - IT Services
      - Industrial Conglomerates
      - Insurance
      - Interactive Media Services
      - Machinery
      - Media
      - Metals and Mining
      - Oil, Gas & Consumable Fuels
      - Pharmaceuticals
      - Professional Services
      - Real Estate Management and Development
      - Restaurants
      - Road and Rail
      - Semiconductors and Semiconductor Equipment
      - Software
      - Specialty Retail
      - Structured Note
      - Structured Subordinated Note
      - Technology Hardware, Storage & Peripherals
      - Textiles, Apparel & Luxury Goods
      - Trading Companies and Distributors
      industry_position: prefix
      remainder_target: issuer_name
    rate_parser: *id001
  normalization:
    legal_suffixes:
      remove_preceding_comma: true
    date_formats:
    - '%m/%d/%Y'
    - '%Y-%m-%d'
    spread_input_unit: percent
    spread_output_format: decimal
    reference_index_aliases:
      S: SOFR
      P: Prime
  validation: {}
  overrides: []
